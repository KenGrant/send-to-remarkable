          cat > 'taskpane.js' <<'EOF_RM'
          // Send to reMarkable: Outlook add-in task pane.
          // Creates a Microsoft To Do task from the open email. Dayfolio syncs To Do to the reMarkable planner.

          import {
            store, ymd, prettyDate, isConfigured, itemDetails, alreadySent,
            getToken, listLists, chosenList, chooseList, createTaskFromEmail, todoLink, friendly,
          } from "./core.js";

          const $ = (id) => document.getElementById(id);
          const views = ["form-view", "busy-view", "done-view", "error-view"];

          let due = "tomorrow";
          let current = null; // details of the open email
          let lists = null;   // To Do lists once loaded

          function show(view) {
            for (const v of views) $(v).hidden = v !== view;
          }

          function showError(msg) {
            $("error-text").textContent = msg;
            show("error-view");
          }

          // ---------- due date ----------

          function dueDate() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            switch (due) {
              case "today": return d;
              case "tomorrow": d.setDate(d.getDate() + 1); return d;
              case "monday": d.setDate(d.getDate() + (((8 - d.getDay()) % 7) || 7)); return d;
              case "pick": {
                const v = $("due-pick").value;
                if (!v) return null;
                const [y, m, day] = v.split("-").map(Number);
                return new Date(y, m - 1, day);
              }
              default: return null;
            }
          }

          function setDue(value) {
            due = value;
            for (const c of document.querySelectorAll("#due-chips .chip")) {
              c.setAttribute("role", "radio");
              c.setAttribute("aria-checked", String(c.dataset.due === value));
            }
            $("due-pick").hidden = value !== "pick";
            if (value === "pick" && !$("due-pick").value) $("due-pick").value = ymd(new Date());
            const d = dueDate();
            $("due-hint").textContent = d ? `Due ${prettyDate(d)}` : "No due date. It may not show on a specific planner day.";
            $("reminder").disabled = !d;
            if (!d) $("reminder").checked = false;
          }

          // ---------- list picker ----------

          function renderLists() {
            const sel = $("list");
            const chosen = chosenList();
            sel.textContent = "";
            if (!lists) {
              const o = new Option(chosen ? chosen.name : "Default list (Tasks)", chosen ? chosen.id : "");
              sel.add(o);
              sel.add(new Option("Load my lists…", "__load"));
              sel.value = o.value;
            } else {
              for (const l of lists) sel.add(new Option(l.name, l.isDefault ? "" : l.id));
              const ok = chosen && lists.some((l) => l.id === chosen.id);
              if (chosen && !ok) chooseList(null); // chosen list no longer exists
              sel.value = ok ? chosen.id : "";
            }
            updateListHint();
          }

          function updateListHint() {
            const chosen = chosenList();
            $("list-hint").textContent = chosen
              ? "Check Dayfolio syncs this list, or the task won't reach your reMarkable."
              : "";
          }

          async function loadLists(interactive) {
            try {
              const token = await getToken({ interactive });
              lists = await listLists(token);
            } catch (e) {
              if (interactive) $("list-hint").textContent = `Couldn't load lists: ${friendly(e)}`;
              return;
            }
            renderLists();
          }

          async function onListChange() {
            const v = $("list").value;
            if (v === "__load") {
              renderLists(); // put the current choice back while loading
              $("list-hint").textContent = "Loading your lists…";
              await loadLists(true);
              return;
            }
            const picked = lists ? lists.find((l) => (l.isDefault ? "" : l.id) === v) : null;
            chooseList(v ? (picked || { id: v, name: $("list").selectedOptions[0].text }) : null);
            updateListHint();
          }

          // ---------- the open email ----------

          function loadItem() {
            const item = Office.context.mailbox.item;
            if (!item) {
              current = null;
              showError("Open an email first, then press Send to reMarkable.");
              return;
            }
            current = itemDetails(item);
            $("title").value = current.subject;
            $("note").value = "";
            $("dup-hint").hidden = !alreadySent(current.restId);
            show("form-view");
          }

          // ---------- create the task ----------

          async function submit() {
            if (!current) return;
            const title = $("title").value.trim();
            if (!title) { $("title").focus(); return; }
            const d = dueDate();
            if (due === "pick" && !d) { $("due-pick").focus(); return; }

            show("busy-view");
            $("busy-text").textContent = "Signing in…";
            try {
              const token = await getToken();
              $("busy-text").textContent = "Creating task…";
              const { task, listName, fellBack } = await createTaskFromEmail(token, current, {
                title,
                due: d,
                note: $("note").value.trim(),
                important: $("important").checked,
                reminder: $("reminder").checked,
                includeSnippet: $("snippet").checked,
              });
              const where = listName ? ` in ${listName}` : "";
              $("done-text").textContent = (d ? `"${title}", due ${prettyDate(d)}${where}.` : `"${title}"${where}, no due date.`)
                + (fellBack ? " Your chosen list no longer exists, so it went in your default list." : "");
              $("open-todo").href = todoLink(task.id);
              show("done-view");
              if (fellBack) { lists = null; renderLists(); }
            } catch (e) {
              console.error(e);
              showError(friendly(e));
            }
          }

          // ---------- wire up ----------

          Office.onReady(() => {
            if (!isConfigured()) {
              showError("This add-in isn't configured yet: set clientId and baseUrl in config.js.");
              return;
            }
            for (const c of document.querySelectorAll("#due-chips .chip")) {
              c.addEventListener("click", () => {
                setDue(c.dataset.due);
                if (c.dataset.due !== "pick") store("rm.due", c.dataset.due);
              });
            }
            $("due-pick").addEventListener("change", () => setDue("pick"));
            $("list").addEventListener("change", onListChange);
            $("submit").addEventListener("click", submit);
            $("again").addEventListener("click", loadItem);
            $("retry").addEventListener("click", loadItem);
            $("title").addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit(); });

            const last = store("rm.due");
            setDue(["today", "tomorrow", "monday", "none"].includes(last) ? last : "tomorrow");
            renderLists();
            loadLists(false); // fills the picker quietly if you're already signed in

            // Pinned task pane: refresh when you move to another email.
            try {
              Office.context.mailbox.addHandlerAsync(Office.EventType.ItemChanged, loadItem);
            } catch { /* older hosts */ }
            loadItem();
          });
          EOF_RM

      - name: Fill in client ID, tenant and address
        env:
          CLIENT_ID: ${{ vars.CLIENT_ID }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          cd site
          BASE_URL="${BASE_URL%/}"
          echo "Add-in address: $BASE_URL"
          sed -i "s#__BASE_URL__#${BASE_URL}#g" manifest.xml config.js
          sed -i "s#__CLIENT_ID__#${CLIENT_ID}#g; s#tenant: \"kengrant.com\"#tenant: \"${TENANT}\"#" config.js
          ! grep -R "__BASE_URL__\|__CLIENT_ID__" . || { echo "::error::Placeholder left unfilled"; exit 1; }
          echo "Manifest: $BASE_URL/manifest.xml" >> "$GITHUB_STEP_SUMMARY"
          echo "NAA redirect URI for Entra: brk-multihub://$(echo "$BASE_URL" | sed -E 's#https?://([^/]+).*#\1#')" >> "$GITHUB_STEP_SUMMARY"
          echo "Pop-up redirect URI for Entra: $BASE_URL/auth.html" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch Microsoft sign-in library (pinned, from npm)
        run: |
          mkdir -p /tmp/msal && cd /tmp/msal
          npm init -y >/dev/null
          npm install --no-save --ignore-scripts "@azure/msal-browser@${MSAL_VERSION}"
          npm audit signatures || true
          SRC=node_modules/@azure/msal-browser/lib/msal-browser.min.js
          test -f "$SRC" || { echo "::error::MSAL bundle not found"; ls node_modules/@azure/msal-browser/lib; exit 1; }
          cp "$SRC" "$GITHUB_WORKSPACE/site/vendor/msal-browser.min.js"
          sha256sum "$GITHUB_WORKSPACE/site/vendor/msal-browser.min.js"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
