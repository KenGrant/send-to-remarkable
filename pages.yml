# Send to reMarkable — Outlook add-in
# This one file builds and publishes the whole add-in to GitHub Pages.
# Every file the add-in serves is written out below, so you can review all of it here.
#
# Setup (once):
#   1. Settings > Pages > Source: "GitHub Actions"
#   2. Settings > Secrets and variables > Actions > Variables > New variable:
#        CLIENT_ID = the Application (client) ID from your Entra app registration
#   3. Actions tab > "Deploy Send to reMarkable" > Run workflow
#
# Nothing here is secret. The client ID is a public identifier.

name: Deploy Send to reMarkable

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  MSAL_VERSION: "3.27.0"   # Microsoft sign-in library, pinned; npm verifies its integrity
  TENANT: "kengrant.com"   # only accounts in this tenant can sign in

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check settings
        env:
          CLIENT_ID: ${{ vars.CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Add a repository variable CLIENT_ID (Settings > Secrets and variables > Actions > Variables)."
            exit 1
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Write add-in files
        run: |
          mkdir -p site/assets site/vendor
          cd site
