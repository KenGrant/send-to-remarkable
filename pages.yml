          cat > 'commands.js' <<'EOF_RM'
          // One-tap "Add for tomorrow" button (Outlook on the web, Windows and Mac).
          // Creates the task without opening the pane, then shows a note at the top of the email.

          import {
            isConfigured, itemDetails, alreadySent, tomorrow, prettyDate,
            getToken, createTaskFromEmail, chosenList, friendly,
          } from "./core.js";

          const KEY = "rmResult";

          function notify(item, message, isError) {
            const msg = message.length > 150 ? message.slice(0, 149) + "…" : message;
            const details = isError
              ? { type: Office.MailboxEnums.ItemNotificationMessageType.ErrorMessage, message: msg }
              : { type: Office.MailboxEnums.ItemNotificationMessageType.InformationalMessage, message: msg, icon: "Icon.16", persistent: false };
            return new Promise((resolve) => item.notificationMessages.replaceAsync(KEY, details, () => resolve()));
          }

          async function addTomorrow(event) {
            const item = Office.context.mailbox.item;
            try {
              if (!isConfigured()) throw new Error("The add-in isn't configured yet.");
              const details = itemDetails(item);
              const repeat = alreadySent(details.restId);
              // Never pops up a sign-in window from here: the pane handles first sign-in.
              const token = await getToken({ interactive: false });
              const d = tomorrow();
              const { listName, fellBack } = await createTaskFromEmail(token, details, {
                title: details.subject,
                due: d,
                note: "",
                important: false,
                reminder: false,
                includeSnippet: false,
              });
              const where = listName ? ` in ${listName}` : "";
              let msg = `Added to To Do for ${prettyDate(d)}${where}.`;
              if (fellBack) msg += " Your chosen list was gone, so it went in the default list.";
              else if (repeat) msg += " (You'd sent this email before.)";
              await notify(item, msg, false);
            } catch (e) {
              console.error(e);
              await notify(item, `Couldn't add the task. ${friendly(e)}`, true);
            } finally {
              event.completed();
            }
          }

          Office.onReady(() => {
            Office.actions.associate("addTomorrow", addTomorrow);
          });

          // Shown in the log so you can tell which list one-tap uses.
          try { console.info("Send to reMarkable one-tap list:", (chosenList() || { name: "default" }).name); } catch { /* ignore */ }
          EOF_RM
          cat > 'config.js' <<'EOF_RM'
          // Settings for the Send to reMarkable add-in.
          // None of these values are secret: a public client ID and your tenant domain.
          export const CONFIG = {
            // Application (client) ID from the Entra app registration.
            clientId: "__CLIENT_ID__",
            // Your Microsoft 365 tenant (domain or tenant ID). Only accounts in it can sign in.
            tenant: "kengrant.com",
            // Where this add-in is hosted (no trailing slash).
            baseUrl: "__BASE_URL__",
            // Least-privilege delegated permissions.
            scopes: ["Tasks.ReadWrite", "Mail.ReadBasic", "User.Read"],
          };
          EOF_RM
          cat > 'core.js' <<'EOF_RM'
          // Shared logic for the task pane and the one-tap button.
          // All network calls go only to Microsoft (sign-in + Graph).

          import { CONFIG } from "./config.js";

          const GRAPH = "https://graph.microsoft.com/v1.0";

          // ---------- small helpers ----------

          export function store(key, value) {
            try {
              if (value === undefined) return JSON.parse(localStorage.getItem(key) || "null");
              if (value === null) localStorage.removeItem(key);
              else localStorage.setItem(key, JSON.stringify(value));
            } catch { /* storage unavailable */ }
            return null;
          }

          export function ymd(d) {
            const p = (n) => String(n).padStart(2, "0");
            return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}`;
          }

          export function prettyDate(d) {
            return d.toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
          }

          export function tomorrow() {
            const d = new Date();
            d.setHours(0, 0, 0, 0);
            d.setDate(d.getDate() + 1);
            return d;
          }

          export function asyncOffice(fn) {
            return new Promise((resolve, reject) =>
              fn((res) => (res.status === Office.AsyncResultStatus.Succeeded ? resolve(res.value) : reject(res.error))));
          }

          export function isConfigured() {
            return !CONFIG.clientId.startsWith("__") && !CONFIG.baseUrl.startsWith("__");
          }

          // ---------- the open email ----------

          function restIdFor(item) {
            const host = (Office.context.mailbox.diagnostics && Office.context.mailbox.diagnostics.hostName) || "";
            if (/ios|android/i.test(host)) return item.itemId; // mobile already returns the REST id
            try {
              return Office.context.mailbox.convertToRestId(item.itemId, Office.MailboxEnums.RestVersion.v2_0);
            } catch {
              return item.itemId;
            }
          }

          export function itemDetails(item) {
            return {
              item,
              subject: item.subject || "(no subject)",
              from: item.from ? `${item.from.displayName || ""} <${item.from.emailAddress || ""}>`.trim() : "",
              received: item.dateTimeCreated ? new Date(item.dateTimeCreated) : null,
              restId: restIdFor(item),
            };
          }

          export async function snippetText(item) {
            try {
              const text = await asyncOffice((cb) => item.body.getAsync(Office.CoercionType.Text, cb));
              return text.replace(/\s+/g, " ").trim().slice(0, 500);
            } catch {
              return "";
            }
          }

          export function alreadySent(restId) {
            const sent = store("rm.sent") || {};
            return Boolean(sent[restId]);
          }

          export function rememberSent(restId, taskId) {
            const sent = store("rm.sent") || {};
            sent[restId] = { taskId, at: Date.now() };
            const keys = Object.keys(sent);
            if (keys.length > 200) {
              keys.sort((a, b) => sent[a].at - sent[b].at).slice(0, keys.length - 200).forEach((k) => delete sent[k]);
            }
            store("rm.sent", sent);
          }

          // ---------- sign-in (Microsoft only) ----------

          let pca = null;

          async function getPca() {
            if (pca) return pca;
            if (!window.msal) throw new Error("The Microsoft sign-in library didn't load. Check your connection and try again.");
            const cfg = {
              auth: {
                clientId: CONFIG.clientId,
                authority: `https://login.microsoftonline.com/${CONFIG.tenant}`,
                redirectUri: `${CONFIG.baseUrl}/auth.html`,
              },
              cache: { cacheLocation: "sessionStorage" },
            };
            const naa = Office.context.requirements.isSetSupported("NestedAppAuth", "1.1");
            pca = naa
              ? await window.msal.createNestablePublicClientApplication(cfg)
              : await window.msal.PublicClientApplication.createPublicClientApplication(cfg);
            return pca;
          }

          // interactive: false = never show a sign-in window (used by the one-tap button and background loads).
          export async function getToken({ interactive = true } = {}) {
            const app = await getPca();
            const loginHint = Office.context.mailbox.userProfile && Office.context.mailbox.userProfile.emailAddress;
            const req = { scopes: CONFIG.scopes, loginHint };
            const account = app.getActiveAccount() || app.getAllAccounts()[0];
            try {
              const r = await app.acquireTokenSilent(account ? { ...req, account } : req);
              return r.accessToken;
            } catch (e) {
              if (!interactive) {
                const err = new Error("Sign-in needed");
                err.needsSignIn = true;
                err.cause = e;
                throw err;
              }
              const r = await app.acquireTokenPopup(req);
              if (r.account) app.setActiveAccount(r.account);
              return r.accessToken;
            }
          }

          // ---------- Microsoft Graph ----------

          export async function graph(token, path, options = {}) {
            const res = await fetch(GRAPH + path, {
              ...options,
              headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json", ...(options.headers || {}) },
            });
            if (!res.ok) {
              let msg = `${res.status} ${res.statusText}`;
              try {
                const j = await res.json();
                if (j.error && j.error.message) msg = j.error.message;
              } catch { /* keep status text */ }
              const err = new Error(msg);
              err.status = res.status;
              throw err;
            }
            return res.status === 204 ? null : res.json();
          }

          // All To Do lists, default list first, the rest by name.
          export async function listLists(token) {
            const data = await graph(token, "/me/todo/lists?$select=id,wellknownListName,displayName&$top=100");
            // Leave out "Flagged Emails": To Do fills it from Outlook flags and new tasks can't be added there.
            const lists = data.value.filter((l) => l.wellknownListName !== "flaggedEmails").map((l) => ({
              id: l.id,
              name: l.wellknownListName === "defaultList" ? `${l.displayName} (default)` : l.displayName,
              isDefault: l.wellknownListName === "defaultList",
            }));
            lists.sort((a, b) => (b.isDefault - a.isDefault) || a.name.localeCompare(b.name));
            return lists;
          }

          // The list chosen in the pane (remembered), else the default list.
          export function chosenList() {
            return store("rm.list"); // { id, name } or null = default
          }

          export function chooseList(list) {
            store("rm.list", list && !list.isDefault ? { id: list.id, name: list.name } : null);
          }

          async function defaultListId(token) {
            const cached = store("rm.defaultListId");
            if (cached) return cached;
            const lists = await listLists(token);
            const def = lists.find((l) => l.isDefault) || lists[0];
            if (!def) throw new Error("Couldn't find your To Do task list.");
            store("rm.defaultListId", def.id);
            return def.id;
          }

          async function emailLink(token, restId) {
            try {
              const m = await graph(token, `/me/messages/${encodeURIComponent(restId)}?$select=webLink`);
              if (m && m.webLink) return m.webLink;
            } catch { /* fall back below */ }
            return `https://outlook.office.com/mail/deeplink/read/${encodeURIComponent(restId)}`;
          }

          // Creates the task. Returns { task, listName, fellBack }.
          // opts: { title, due (Date|null), note, important, reminder, includeSnippet, listId? }
          export async function createTaskFromEmail(token, details, opts) {
            const chosen = chosenList();
            const wantedListId = opts.listId !== undefined ? opts.listId : (chosen && chosen.id);

            const [link, snippet] = await Promise.all([
              emailLink(token, details.restId),
              opts.includeSnippet ? snippetText(details.item) : Promise.resolve(""),
            ]);

            const lines = [];
            if (opts.note) lines.push(opts.note, "");
            lines.push(`Email: ${details.subject}`);
            if (details.from) lines.push(`From: ${details.from}`);
            if (details.received) lines.push(`Received: ${details.received.toLocaleString("en-GB")}`);
            if (snippet) lines.push("", snippet + (snippet.length >= 500 ? "…" : ""));

            const task = {
              title: opts.title,
              importance: opts.important ? "high" : "normal",
              body: { content: lines.join("\n"), contentType: "text" },
              linkedResources: [{
                webUrl: link,
                applicationName: "Outlook",
                displayName: details.subject.slice(0, 255),
                externalId: details.restId,
              }],
            };
            const d = opts.due;
            if (d) {
              task.dueDateTime = { dateTime: `${ymd(d)}T00:00:00`, timeZone: "UTC" };
              if (opts.reminder) {
                const r = new Date(d.getFullYear(), d.getMonth(), d.getDate(), 9, 0, 0);
                task.isReminderOn = true;
                task.reminderDateTime = { dateTime: r.toISOString().slice(0, 19), timeZone: "UTC" };
              }
            }

            const post = (listId) => graph(token, `/me/todo/lists/${encodeURIComponent(listId)}/tasks`, { method: "POST", body: JSON.stringify(task) });

            let created, listName = chosen && wantedListId === chosen.id ? chosen.name : null, fellBack = false;
            if (wantedListId) {
              try {
                created = await post(wantedListId);
              } catch (e) {
                if (e.status !== 404) throw e;
                // The chosen list was deleted: forget it and use the default list.
                chooseList(null);
                fellBack = true;
                listName = null;
              }
            }
            if (!created) {
              try {
                created = await post(await defaultListId(token));
              } catch (e) {
                if (e.status !== 404) throw e;
                store("rm.defaultListId", null);
                created = await post(await defaultListId(token));
              }
            }
            rememberSent(details.restId, created.id);
            return { task: created, listName, fellBack };
          }

          export function todoLink(taskId) {
            return `https://to-do.office.com/tasks/id/${encodeURIComponent(taskId)}/details`;
          }

          export function friendly(e) {
            const m = (e && (e.errorMessage || e.message)) || String(e);
            if (e && e.needsSignIn) return "Open Send to reMarkable once to sign in, then try again.";
            if (/popup|user_cancelled|cancel/i.test(m)) return "Sign-in was cancelled or the pop-up was blocked. Please try again.";
            if (/consent|AADSTS65001/i.test(m)) return "The add-in hasn't been granted permission yet. An admin needs to grant consent in Entra.";
            if (/AADSTS50011|redirect/i.test(m)) return "Sign-in is misconfigured (redirect URI). Check the app registration.";
            if (/AADSTS700016|application.*not found/i.test(m)) return "The app registration couldn't be found. Check the CLIENT_ID variable.";
            return m;
          }
          EOF_RM
